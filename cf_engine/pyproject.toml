[project]
name = "cf_engine"
version = "0.1.0"
description = "ClozFlow CF Benchmark Evaluation Engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.2",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_engine"]
