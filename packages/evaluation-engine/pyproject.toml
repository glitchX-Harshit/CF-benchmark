[project]
name = "evaluation-engine"
version = "0.1.0"
description = "ClozFlow CF Benchmark Evaluation Engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4.2",
    "pyyaml>=6.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
